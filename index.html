<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte à rebours Ping Pong</title>
    <!-- Importation de polices Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* Fond de la table de ping-pong amélioré */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #278148 0%, #154526 100%);
            font-family: 'Montserrat', sans-serif;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Lignes blanches de la table */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 6px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 0;
        }

        /* Le filet de ping-pong au centre */
        .net {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 25px;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 4px,
                rgba(255, 255, 255, 0.3) 4px,
                rgba(255, 255, 255, 0.3) 6px
            ),
            repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 4px,
                rgba(255, 255, 255, 0.3) 4px,
                rgba(255, 255, 255, 0.3) 6px
            );
            border-top: 4px solid white;
            transform: translateY(-50%);
            z-index: 1;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }

        /* Conteneur principal par-dessus la table */
        .content-wrapper {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* Le tableau d'affichage */
        .scoreboard {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 8px solid #d32f2f;
            border-radius: 15px;
            padding: 30px 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #eee;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .countdown {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Les chiffres digitaux */
        .number {
            font-family: 'Share Tech Mono', monospace;
            font-size: 4.5rem;
            background-color: #050505;
            padding: 15px 20px;
            border-radius: 8px;
            color: #ff9800;
            min-width: 80px;
            box-shadow: inset 0 0 15px rgba(255, 152, 0, 0.1), 0 2px 0 rgba(255,255,255,0.1);
            border: 1px solid #333;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        .label {
            margin-top: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #888;
            font-weight: 800;
        }

        /* Section Question */
        .question-section {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .question-section h2 {
            margin: 0 0 20px 0;
            font-size: 1.5rem;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        /* Boutons stylisés */
        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            color: white;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            position: relative; /* Nécessaire pour garder sa place dans la structure */
        }

        .btn-oui {
            background-color: #d32f2f;
            border-bottom: 5px solid #9a0007;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .btn-oui:hover {
            transform: translateY(3px);
            border-bottom: 2px solid #9a0007;
            background-color: #e53935;
        }

        .btn-non {
            background-color: #212121;
            border-bottom: 5px solid #000000;
            /* Une transition fluide sur le "transform" donne l'effet de glissement/fuite */
            transition: transform 0.1s linear; 
            z-index: 100;
        }

        /* Message final */
        .success-message {
            font-size: 1.4rem;
            line-height: 1.5;
            color: #4caf50;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: 800;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Balle de ping pong animée */
        .ball-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        .ball {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 10px 10px, #ffb74d, #f57c00);
            border-radius: 50%;
            box-shadow: inset -3px -3px 10px rgba(0,0,0,0.3);
            animation: bounce 2s infinite cubic-bezier(0.5, 0.05, 1, 0.5) alternate, moveX 4s infinite linear alternate;
        }

        .ball-shadow {
            position: absolute;
            width: 30px;
            height: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            filter: blur(4px);
            animation: shadowScale 2s infinite cubic-bezier(0.5, 0.05, 1, 0.5) alternate, moveX 4s infinite linear alternate;
            margin-top: 45px;
        }

        @keyframes bounce {
            0% { top: 10%; transform: scale(1.1); }
            100% { top: 70%; transform: scale(0.9); }
        }
        @keyframes shadowScale {
            0% { top: 10%; transform: scale(0.2); opacity: 0.1; }
            100% { top: 70%; transform: scale(1.5); opacity: 0.6; }
        }
        @keyframes moveX {
            0% { left: 10%; }
            100% { left: 90%; }
        }
    </style>
</head>
<body>

    <!-- Décorations de la table -->
    <div class="net"></div>
    
    <div class="ball-container">
        <div class="ball-shadow"></div>
        <div class="ball"></div>
    </div>

    <!-- Interface -->
    <div class="content-wrapper">
        
        <!-- Scoreboard / Compte à rebours -->
        <div class="scoreboard">
            <h1>Prochain match à 16h30</h1>
            <div class="countdown">
                <div class="time-box">
                    <span class="number" id="hours">00</span>
                    <span class="label">Heures</span>
                </div>
                <div class="time-box">
                    <span class="number" id="minutes">00</span>
                    <span class="label">Minutes</span>
                </div>
                <div class="time-box">
                    <span class="number" id="seconds">00</span>
                    <span class="label">Secondes</span>
                </div>
            </div>
        </div>

        <!-- Section interactive -->
        <div class="question-section" id="interactive-section">
            <h2 id="question-text">Est-ce que tu as hâte ?</h2>
            <div class="buttons-container" id="buttons-container">
                <button id="btn-oui" class="btn btn-oui">Oui</button>
                <button id="btn-non" class="btn btn-non">Non</button>
            </div>
        </div>

    </div>

    <script>
        // --- LOGIQUE DU COMPTE À REBOURS ---
        function updateCountdown() {
            const now = new Date();
            let target = new Date();
            target.setHours(16, 30, 0, 0);

            if (now > target) {
                target.setDate(target.getDate() + 1);
            }

            const diff = target - now;
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- LOGIQUE DE LA SECTION INTERACTIVE ---
        const btnOui = document.getElementById('btn-oui');
        const btnNon = document.getElementById('btn-non');
        const interactiveSection = document.getElementById('interactive-section');

        // Événement pour le bouton "Oui"
        btnOui.addEventListener('click', () => {
            interactiveSection.innerHTML = '<div class="success-message">Moi aussi ! J\'espère surtout avoir une raquette et ne pas jouer à la main... 🏓</div>';
        });

        // Variables pour mémoriser le déplacement total du bouton Non
        let currentTranslateX = 0;
        let currentTranslateY = 0;

        // Comportement "Aimant inversé" du bouton Non
        document.addEventListener('mousemove', (e) => {
            // Si la section a été remplacée (le bouton oui a été cliqué), on arrête l'animation
            if (!document.getElementById('btn-non')) return;

            // Récupérer la position exacte du bouton à l'écran
            const rect = btnNon.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;

            // Calculer la distance entre la souris et le centre du bouton
            const distanceX = e.clientX - btnCenterX;
            const distanceY = e.clientY - btnCenterY;
            const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

            // Distance minimale à partir de laquelle le bouton commence à fuir (rayon en pixels)
            const dangerZone = 120;

            if (distance < dangerZone) {
                // On calcule le vecteur de fuite (direction opposée à la souris)
                const escapeX = (distanceX / distance) * -1;
                const escapeY = (distanceY / distance) * -1;

                // Plus la souris est proche, plus le bouton fuit vite
                const speed = (dangerZone - distance) * 0.5;

                // On accumule la position de fuite
                currentTranslateX += escapeX * speed;
                currentTranslateY += escapeY * speed;

                // On applique le déplacement en CSS via transform: translate
                btnNon.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
            }
        });
    </script>
</body>
</html>
