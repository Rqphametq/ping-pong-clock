            margin: 0;
            padding: 0;

            flex-direction: column;

            align-items: center;
            background: radial-gradient(circle, #278148 0%, #154526 100%);
            font-family: 'Montserrat', sans-serif;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Lignes décoratives du fond */
        .bg-lines::before, .bg-lines::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 0;
        }
        .bg-lines::before { top: 50%; left: 0; width: 100%; height: 6px; }
        .bg-lines::after { top: 0; left: 50%; width: 6px; height: 100%; }

        .net {
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 25px;
            background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255, 255, 255, 0.3) 4px, rgba(255, 255, 255, 0.3) 6px),
                        repeating-linear-gradient(-45deg, transparent, transparent 4px, rgba(255, 255, 255, 0.3) 4px, rgba(255, 255, 255, 0.3) 6px);
            border-top: 4px solid white;
            transform: translateY(-50%);
            z-index: 1;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .content-wrapper {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .scoreboard {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 8px solid #d32f2f;
            border-radius: 15px;
            padding: 30px 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        h1 { margin-top: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px; }

        .countdown { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .time-box { display: flex; flex-direction: column; align-items: center; }

        .number {
            font-family: 'Share Tech Mono', monospace;
            font-size: 4.5rem; background-color: #050505; padding: 15px 20px;
            border-radius: 8px; color: #ff9800; min-width: 80px;
            border: 1px solid #333; text-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }
        .label { margin-top: 8px; font-size: 0.85rem; text-transform: uppercase; color: #888; font-weight: 800; }

        /* Section Interactive */
        .question-section {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            padding: 25px; border-radius: 15px; text-align: center;
            width: 100%; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .buttons-container { display: flex; justify-content: center; gap: 20px; position: relative; margin-bottom: 25px; }

        .btn {
            font-family: 'Montserrat', sans-serif; font-size: 1.2rem; font-weight: 800;
            padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer;
            text-transform: uppercase; color: white; position: relative;
        }
        .btn-oui { background-color: #d32f2f; border-bottom: 5px solid #9a0007; transition: transform 0.2s, background-color 0.2s; }
        .btn-oui:hover { transform: translateY(3px); border-bottom: 2px solid #9a0007; background-color: #e53935; }
        
        .btn-non { background-color: #212121; border-bottom: 5px solid #000000; transition: transform 0.1s linear; z-index: 100; }
        
        .btn-train { background-color: #1976D2; border-bottom: 5px solid #115293; font-size: 1rem; padding: 12px 30px; transition: 0.2s; }
        .btn-train:hover { transform: translateY(3px); border-bottom: 2px solid #115293; background-color: #2196F3; }

        .success-message { font-size: 1.4rem; color: #4caf50; font-weight: 800; }

        /* --- CONTENEUR DU MINI JEU --- */
        #game-wrapper {
            display: none; 
            flex-direction: column;
            align-items: center;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 30px 30px 30px;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            border: 1px solid #333;
            max-width: 95vw;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        .game-title {
            font-size: 1.2rem;
            color: #ff9800;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Bouton retour placé en haut à droite */
        .btn-retour { 
            background-color: #d32f2f; 
            border-bottom: 4px solid #9a0007; 
            font-size: 0.85rem; 
            padding: 8px 15px; 
        }
        .btn-retour:hover { 
            transform: translateY(2px); 
            border-bottom: 2px solid #9a0007; 
            background-color: #e53935;
        }

        canvas {
            background-color: #2c2c2c; 
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
            cursor: none;
            max-height: 65vh; /* S'adapte à la hauteur des petits écrans */
            max-width: 100%;
        }

    </style>
</head>

        </div>

        <div class="game-header">
            <h2 class="game-title">Mode Entraînement</h2>
            <!-- Le bouton est maintenant bien visible en haut à droite -->
            <button id="btn-retour" class="btn-close">Quitter ✖</button>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. COMPTE À REBOURS
        // ==========================================
        function updateCountdown() {
            const now = new Date();
            let target = new Date();
            target.setHours(16, 30, 0, 0);
            if (now > target) target.setDate(target.getDate() + 1);

            const diff = target - now;
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // ==========================================
        // 2. BOUTON AIMANT INVERSÉ
        // ==========================================
        const btnOui = document.getElementById('btn-oui');
        const btnNon = document.getElementById('btn-non');
        const interactiveSection = document.getElementById('interactive-section');

        btnOui.addEventListener('click', () => {
            interactiveSection.innerHTML = '<div class="success-message">Moi aussi ! J\'espère surtout avoir une raquette et ne pas jouer à la main... 🏓</div>';
        });

        let currentTranslateX = 0;
        let currentTranslateY = 0;

        document.addEventListener('mousemove', (e) => {
            if (!document.getElementById('btn-non') || document.getElementById('content-wrapper').style.display === 'none') return;
            
            const rect = btnNon.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;

            const distanceX = e.clientX - btnCenterX;
            const distanceY = e.clientY - btnCenterY;
            const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

            if (distance < 120) {
                const escapeX = (distanceX / distance) * -1;
                const escapeY = (distanceY / distance) * -1;
                const speed = (120 - distance) * 0.4;
                currentTranslateX += escapeX * speed;
                currentTranslateY += escapeY * speed;
                btnNon.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
            }
        });

        // ==========================================
        // 3. MOTEUR DU JEU PING PONG
        // ==========================================
        const contentWrapper = document.getElementById('content-wrapper');
        const gameWrapper = document.getElementById('game-wrapper');
        const btnTrain = document.getElementById('btn-train');
        const btnRetour = document.getElementById('btn-retour');

        btnTrain.addEventListener('click', () => {
            contentWrapper.style.display = 'none';
            document.querySelector('.bg-lines').style.display = 'none';
            document.querySelector('.net').style.display = 'none';
            gameWrapper.style.display = 'flex';
            resetBall();
        });

        btnRetour.addEventListener('click', () => {
            gameWrapper.style.display = 'none';
            contentWrapper.style.display = 'flex';
            document.querySelector('.bg-lines').style.display = 'block';
            document.querySelector('.net').style.display = 'block';
            gameState = 'START';
        });

        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        const player = { x: canvas.width/2 - 40, y: canvas.height - 45, width: 70, height: 24, color: "#d32f2f", score: 0 };
        const bot = { x: canvas.width/2 - 40, y: 25, width: 70, height: 24, color: "#212121", score: 0 };
        const ball = { x: canvas.width/2, y: canvas.height/2, radius: 8, vx: 0, vy: 0, color: "#ffb74d" };

        let gameState = 'START';

        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let mouseX = (e.clientX - rect.left) * scaleX;
            
            player.x = mouseX - player.width/2;
            
            if(player.x < 15) player.x = 15;
            if(player.x + player.width > canvas.width - 15) player.x = canvas.width - 15 - player.width;
        });

        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space' && gameState === 'START' && gameWrapper.style.display === 'flex') {
                gameState = 'PLAYING';
                ball.x = canvas.width/2;
                ball.y = canvas.height/2;
                ball.vy = 6; 
                ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3;
            }
        });

        function resetBall() {
            ball.x = canvas.width/2;
            ball.y = canvas.height/2;
            ball.vx = 0;
            ball.vy = 0;
            gameState = 'START';
        }

        function updateGame() {
            if(gameState === 'PLAYING') {
                ball.x += ball.vx;
                ball.y += ball.vy;

                if(ball.x - ball.radius < 15 || ball.x + ball.radius > canvas.width - 15) {
                    ball.vx = -ball.vx;
                }

                let botCenter = bot.x + bot.width/2;
                let botSpeed = 4.5; 
                if(botCenter < ball.x - 10) bot.x += botSpeed;
                else if(botCenter > ball.x + 10) bot.x -= botSpeed;
                
                if(bot.x < 15) bot.x = 15;
                if(bot.x + bot.width > canvas.width - 15) bot.x = canvas.width - 15 - bot.width;

                if(ball.y + ball.radius > player.y && ball.y - ball.radius < player.y + player.height && ball.x > player.x && ball.x < player.x + player.width) {
                    ball.vy = -ball.vy;
                    let hitPoint = ball.x - (player.x + player.width/2);
                    hitPoint = hitPoint / (player.width/2);
                    ball.vx = hitPoint * 6; 
                    ball.y = player.y - ball.radius; 
                }

                if(ball.y - ball.radius < bot.y + bot.height && ball.y + ball.radius > bot.y && ball.x > bot.x && ball.x < bot.x + bot.width) {
                    ball.vy = -ball.vy;
                    let hitPoint = ball.x - (bot.x + bot.width/2);
                    hitPoint = hitPoint / (bot.width/2);
                    ball.vx = hitPoint * 6;
                    ball.y = bot.y + bot.height + ball.radius;
                }

                if(ball.y > canvas.height) { 
                    bot.score++;
                    resetBall();
                } else if(ball.y < 0) { 
                    player.score++;
                    resetBall();
                }
            }
        }

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawPaddle(paddle, isPlayer) {
            const centerX = paddle.x + paddle.width / 2;
            const centerY = paddle.y + paddle.height / 2;

            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.beginPath();
            ctx.ellipse(centerX + 8, centerY + 8, paddle.width/2, paddle.height/2, 0, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = "#a66e3d";
            if (isPlayer) {
                ctx.fillRect(centerX - 8, centerY, 16, 35);
            } else {
                ctx.fillRect(centerX - 8, centerY - 35, 16, 35);
            }

            ctx.fillStyle = paddle.color;
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, paddle.width/2, paddle.height/2, 0, 0, Math.PI*2);
            ctx.fill();

            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, paddle.width/2 - 2, paddle.height/2 - 2, 0, Math.PI, 2*Math.PI);
            ctx.stroke();
        }

        function drawGame() {
            drawRect(0, 0, canvas.width, canvas.height, "#2c2c2c");

            const tableMarge = 15;
            drawRect(tableMarge, tableMarge, canvas.width - tableMarge*2, canvas.height - tableMarge*2, "#1a6b3c");

            ctx.strokeStyle = "white";
            ctx.lineWidth = 4;
            ctx.strokeRect(tableMarge + 2, tableMarge + 2, canvas.width - (tableMarge*2) - 4, canvas.height - (tableMarge*2) - 4);

            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, tableMarge);
            ctx.lineTo(canvas.width / 2, canvas.height - tableMarge);
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            ctx.font = "bold 100px 'Share Tech Mono'";
            ctx.textAlign = "center";
            ctx.fillText(bot.score, canvas.width/2, canvas.height/2 - 60);
            ctx.fillText(player.score, canvas.width/2, canvas.height/2 + 130);

            const netY = canvas.height/2;
            drawRect(tableMarge - 5, netY + 2, canvas.width - (tableMarge*2) + 10, 8, "rgba(0,0,0,0.3)"); 
            drawRect(tableMarge - 5, netY - 4, canvas.width - (tableMarge*2) + 10, 8, "#333"); 
            drawRect(tableMarge - 5, netY - 4, canvas.width - (tableMarge*2) + 10, 3, "white"); 
            drawRect(tableMarge - 5, netY - 8, 8, 16, "#111"); 
            drawRect(canvas.width - tableMarge - 3, netY - 8, 8, 16, "#111"); 

            drawPaddle(player, true);
            drawPaddle(bot, false);

            if(gameState === 'PLAYING' || gameState === 'START') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.beginPath(); ctx.arc(ball.x + 6, ball.y + 6, ball.radius, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = ball.color;
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = "rgba(255,255,255,0.6)";
                ctx.beginPath(); ctx.arc(ball.x - 2, ball.y - 2, ball.radius/2.5, 0, Math.PI*2); ctx.fill();
            }

            if(gameState === 'START') {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, canvas.height/2 - 25, canvas.width, 50);
                ctx.fillStyle = "white";
                ctx.font = "bold 18px 'Montserrat'";
                ctx.fillText("APPUYEZ SUR ESPACE", canvas.width/2, canvas.height/2 + 6);
            }
        }

        function loop() {
            updateGame();
            drawGame();
            requestAnimationFrame(loop);
        }
        
        loop();

    </script>
</body>
</html>
