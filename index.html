<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte à rebours Ping Pong</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Importation de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

    <style>
        /* --- STYLES GLOBAUX --- */
        body {
            margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: radial-gradient(circle, #278148 0%, #154526 100%);
            font-family: 'Montserrat', sans-serif; color: white; position: relative; overflow: hidden;
        }

        .bg-lines::before, .bg-lines::after { content: ''; position: absolute; background-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); z-index: 0; }
        .bg-lines::before { top: 50%; left: 0; width: 100%; height: 6px; }
        .bg-lines::after { top: 0; left: 50%; width: 6px; height: 100%; }
        .net {
            position: absolute; top: 50%; left: 0; width: 100%; height: 25px;
            background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255, 255, 255, 0.3) 4px, rgba(255, 255, 255, 0.3) 6px),
                        repeating-linear-gradient(-45deg, transparent, transparent 4px, rgba(255, 255, 255, 0.3) 4px, rgba(255, 255, 255, 0.3) 6px);
            border-top: 4px solid white; transform: translateY(-50%); z-index: 1;
        }

        .content-wrapper { z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; max-width: 600px; padding: 20px; }
        
        .scoreboard { background: linear-gradient(145deg, #1a1a1a, #2a2a2a); border: 8px solid #d32f2f; border-radius: 15px; padding: 30px 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); text-align: center; width: 100%; }
        h1 { margin-top: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .countdown { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .time-box { display: flex; flex-direction: column; align-items: center; }
        .number { font-family: 'Share Tech Mono', monospace; font-size: 4.5rem; background-color: #050505; padding: 15px 20px; border-radius: 8px; color: #ff9800; min-width: 80px; border: 1px solid #333; text-shadow: 0 0 10px rgba(255, 152, 0, 0.5); }
        .label { margin-top: 8px; font-size: 0.85rem; text-transform: uppercase; color: #888; font-weight: 800; }

        .question-section { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); padding: 25px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .buttons-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .btn { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; font-weight: 800; padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer; text-transform: uppercase; color: white; transition: transform 0.2s; }
        .btn-oui { background-color: #d32f2f; border-bottom: 5px solid #9a0007; }
        .btn-oui:hover { transform: translateY(3px); border-bottom: 2px solid #9a0007; background-color: #e53935; }
        .btn-non { background-color: #212121; border-bottom: 5px solid #000000; position: relative; z-index: 100; transition: transform 0.1s linear; }
        .btn-train { background-color: #1976D2; border-bottom: 5px solid #115293; font-size: 1rem; padding: 12px 30px; }
        .btn-train:hover { transform: translateY(3px); border-bottom: 2px solid #115293; background-color: #2196F3; }
        
        /* --- MENU IDENTIFICATION --- */
        #login-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 50; justify-content: center; align-items: center;
        }
        .login-box {
            background: #1a1a1a; padding: 30px; border-radius: 15px; border: 4px solid #ff9800;
            text-align: center; width: 300px;
        }
        .login-box input, .login-box select {
            width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
        }

        /* --- CONTENEUR DU MINI JEU --- */
        #game-wrapper { display: none; flex-direction: column; align-items: center; z-index: 20; background: rgba(0, 0, 0, 0.85); padding: 30px; border-radius: 20px; border: 1px solid #333; }
        .game-header { width: 100%; text-align: center; margin-bottom: 20px; }
        .game-title { font-size: 1.5rem; color: #ff9800; margin: 0; text-transform: uppercase; }
        
        .game-body { display: flex; align-items: flex-start; justify-content: center; gap: 30px; }
        .side-panel { display: flex; flex-direction: column; width: 200px; gap: 15px;}
        
        canvas { background-color: #2c2c2c; border-radius: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5); cursor: none; }
        
        .btn-retour { background-color: #555; border-bottom: 5px solid #333; font-size: 0.9rem; padding: 15px 20px; text-align: center; }
        .btn-retour:hover { transform: translateY(3px); border-bottom: 2px solid #333; }

        /* Classement Top 5 */
        .leaderboard { background: #1a1a1a; padding: 15px; border-radius: 10px; border: 2px solid #d32f2f; }
        .leaderboard h3 { margin: 0 0 10px 0; color: #ff9800; font-size: 1.1rem; text-align: center; text-transform: uppercase; }
        .leaderboard ol { padding-left: 20px; margin: 0; font-size: 0.9rem; }
        .leaderboard li { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; display: flex; justify-content: space-between; }
        .score-val { font-family: 'Share Tech Mono', monospace; font-weight: bold; color: #4caf50; }

        @media (max-width: 900px) {
            .game-body { flex-direction: column-reverse; align-items: center; }
            .side-panel { width: 100%; flex-direction: row; justify-content: center; align-items: center; flex-wrap: wrap; }
            .leaderboard { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="bg-lines"></div>
    <div class="net"></div>

    <!-- ÉCRAN PRINCIPAL -->
    <div class="content-wrapper" id="content-wrapper">
        <div class="scoreboard">
            <h1>Prochain match à 16h30</h1>
            <div class="countdown">
                <div class="time-box"><span class="number" id="hours">00</span><span class="label">Heures</span></div>
                <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
                <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Secondes</span></div>
            </div>
        </div>
        <div class="question-section" id="interactive-section">
            <h2 id="question-text">Est-ce que tu as hâte ?</h2>
            <div class="buttons-container" id="buttons-container">
                <button id="btn-oui" class="btn btn-oui">Oui</button>
                <button id="btn-non" class="btn btn-non">Non</button>
            </div>
            <button id="btn-train" class="btn btn-train">Je veux m'entraîner</button>
        </div>
    </div>

    <!-- OVERLAY IDENTIFICATION -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Identification</h2>
            <select id="existing-profiles">
                <option value="">-- Choisir un profil existant --</option>
            </select>
            <p>OU</p>
            <input type="text" id="new-profile" placeholder="Créer un nouveau profil (Prénom)" maxlength="15">
            <button id="btn-start-game" class="btn btn-train" style="width: 100%; margin-top: 15px;">Jouer</button>
        </div>
    </div>

    <!-- ÉCRAN DU JEU -->
    <div id="game-wrapper">
        <div class="game-header">
            <h2 class="game-title">Mode Entraînement - <span id="current-player-display"></span></h2>
        </div>
        <div class="game-body">
            <div class="side-panel left">
                <button id="btn-retour" class="btn btn-retour">Quitter le jeu</button>
            </div>
            
            <canvas id="pongCanvas" width="440" height="560"></canvas>
            
            <!-- Classement -->
            <div class="side-panel right">
                <div class="leaderboard">
                    <h3>Top 5 Mondial 🌍</h3>
                    <ol id="leaderboard-list">
                        <li>Chargement...</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. CONFIGURATION FIREBASE (À REMPLACER PAR TES CLÉS !)
        // ==========================================
        const firebaseConfig = {
  apiKey: "AIzaSyDP_SQgOwsPBFEgY7mZrZ30T4CB1AYMl0g",
  authDomain: "ping-pong-clock.firebaseapp.com",
  databaseURL: "https://ping-pong-clock-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ping-pong-clock",
  storageBucket: "ping-pong-clock.firebasestorage.app",
  messagingSenderId: "993931768255",
  appId: "1:993931768255:web:a23936af62f5fb3be1310a"
};
        
        // Initialisation Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";
        let bestUserScore = 0;

        // ==========================================
        // 1. GESTION DU CLASSEMENT ET DES PROFILS
        // ==========================================
        const profilesSelect = document.getElementById('existing-profiles');
        const leaderboardList = document.getElementById('leaderboard-list');

        // Récupérer les profils et écouter les changements pour le Top 5 en temps réel
        db.ref('scores').on('value', (snapshot) => {
            const data = snapshot.val();
            let playersArray = [];
            profilesSelect.innerHTML = '<option value="">-- Choisir un profil existant --</option>';
            
            if (data) {
                // Remplir le menu déroulant
                for (let pseudo in data) {
                    let opt = document.createElement('option');
                    opt.value = pseudo; opt.innerText = pseudo;
                    profilesSelect.appendChild(opt);
                    
                    playersArray.push({ name: pseudo, score: data[pseudo].score });
                }

                // Trier pour le Top 5 mondial
                playersArray.sort((a, b) => b.score - a.score);
                const top5 = playersArray.slice(0, 5);
                
                leaderboardList.innerHTML = "";
                top5.forEach(p => {
                    leaderboardList.innerHTML += `<li><span>${p.name}</span> <span class="score-val">${p.score}</span></li>`;
                });
                
                // Mettre à jour le record personnel du joueur actuel en mémoire
                if (currentUser && data[currentUser]) {
                    bestUserScore = data[currentUser].score;
                }
            } else {
                leaderboardList.innerHTML = "<li>Aucun score pour le moment.</li>";
            }
        });

        // ==========================================
        // 2. LOGIQUE D'INTERFACE (COMPTE À REBOURS, BOUTON, LOGIN)
        // ==========================================
        function updateCountdown() {
            let target = new Date(); target.setHours(16, 30, 0, 0);
            if (new Date() > target) target.setDate(target.getDate() + 1);
            const diff = target - new Date();
            document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
            document.getElementById('minutes').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            document.getElementById('seconds').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000); updateCountdown();

        // Bouton aimant inversé "Non"
        let curX = 0, curY = 0;
        document.addEventListener('mousemove', (e) => {
            const btnNon = document.getElementById('btn-non');
            if (!btnNon || document.getElementById('content-wrapper').style.display === 'none') return;
            const rect = btnNon.getBoundingClientRect();
            const dist = Math.sqrt(Math.pow(e.clientX - (rect.left+rect.width/2), 2) + Math.pow(e.clientY - (rect.top+rect.height/2), 2));
            if (dist < 120) {
                curX -= (e.clientX - (rect.left+rect.width/2)) / dist * (120 - dist) * 0.4;
                curY -= (e.clientY - (rect.top+rect.height/2)) / dist * (120 - dist) * 0.4;
                btnNon.style.transform = `translate(${curX}px, ${curY}px)`;
            }
        });
        document.getElementById('btn-oui').addEventListener('click', () => {
            document.getElementById('interactive-section').innerHTML = '<div style="font-size:1.4rem;color:#4caf50;font-weight:800;">Moi aussi ! J\'espère avoir une raquette... 🏓</div>';
        });

        // ==========================================
        // 3. LOGIQUE DU JEU PING PONG
        // ==========================================
        const loginOverlay = document.getElementById('login-overlay');
        const gameWrapper = document.getElementById('game-wrapper');
        const contentWrapper = document.getElementById('content-wrapper');

        document.getElementById('btn-train').addEventListener('click', () => {
            loginOverlay.style.display = 'flex';
        });

        document.getElementById('btn-start-game').addEventListener('click', () => {
            const selectVal = document.getElementById('existing-profiles').value;
            const newVal = document.getElementById('new-profile').value.trim();
            
            currentUser = newVal || selectVal;
            if (!currentUser) { alert("Veuillez choisir ou créer un profil !"); return; }
            
            document.getElementById('current-player-display').innerText = currentUser;
            loginOverlay.style.display = 'none';
            contentWrapper.style.display = 'none';
            document.querySelector('.bg-lines').style.display = 'none';
            document.querySelector('.net').style.display = 'none';
            gameWrapper.style.display = 'flex';
            
            // Récupérer le record perso si existant
            db.ref('scores/' + currentUser).once('value').then((snap) => {
                bestUserScore = snap.val() ? snap.val().score : 0;
            });
            resetBall();
        });

        document.getElementById('btn-retour').addEventListener('click', () => {
            gameWrapper.style.display = 'none';
            contentWrapper.style.display = 'flex';
            document.querySelector('.bg-lines').style.display = 'block';
            document.querySelector('.net').style.display = 'block';
            gameState = 'START';
        });

        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        const player = { x: canvas.width/2 - 40, y: canvas.height - 45, width: 70, height: 24, color: "#d32f2f", score: 0 };
        const bot = { x: canvas.width/2 - 40, y: 25, width: 70, height: 24, color: "#212121" };
        const ball = { x: canvas.width/2, y: canvas.height/2, radius: 8, vx: 0, vy: 0, color: "#ffb74d", baseSpeed: 5 };

        let gameState = 'START';

        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            player.x = ((e.clientX - rect.left) * (canvas.width / rect.width)) - player.width/2;
            if(player.x < 15) player.x = 15;
            if(player.x + player.width > canvas.width - 15) player.x = canvas.width - 15 - player.width;
        });

        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space' && gameState === 'START' && gameWrapper.style.display === 'flex') {
                gameState = 'PLAYING'; player.score = 0;
                ball.x = canvas.width/2; ball.y = canvas.height/2;
                ball.vy = ball.baseSpeed; ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3;
            }
        });

        function resetBall() {
            ball.x = canvas.width/2; ball.y = canvas.height/2;
            ball.vx = 0; ball.vy = 0; gameState = 'START';
        }

        function updateGame() {
            if(gameState === 'PLAYING') {
                ball.x += ball.vx; ball.y += ball.vy;

                // Rebond murs
                if(ball.x - ball.radius < 15 || ball.x + ball.radius > canvas.width - 15) ball.vx = -ball.vx;

                // IA du Bot (Maintenant très fort pour le mode rallye)
                let botCenter = bot.x + bot.width/2;
                let botSpeed = Math.abs(ball.vx) + 2; // Le bot s'adapte à la vitesse de la balle
                if(botCenter < ball.x - 5) bot.x += botSpeed;
                else if(botCenter > ball.x + 5) bot.x -= botSpeed;
                
                if(bot.x < 15) bot.x = 15;
                if(bot.x + bot.width > canvas.width - 15) bot.x = canvas.width - 15 - bot.width;

                // Collision Joueur (C'est ici qu'on gagne 1 point et que ça accélère)
                if(ball.vy > 0 && ball.y + ball.radius > player.y && ball.y - ball.radius < player.y + player.height && ball.x > player.x && ball.x < player.x + player.width) {
                    player.score++; 
                    ball.vy = -ball.vy * 1.05; // Accélération de 5%
                    ball.vx = ball.vx * 1.05;
                    ball.vx += (ball.x - (player.x + player.width/2)) / (player.width/2) * 5; // Effet
                    ball.y = player.y - ball.radius; 
                }

                // Collision Bot (Accélère aussi un tout petit peu au retour)
                if(ball.vy < 0 && ball.y - ball.radius < bot.y + bot.height && ball.y + ball.radius > bot.y && ball.x > bot.x && ball.x < bot.x + bot.width) {
                    ball.vy = -ball.vy * 1.02;
                    ball.vx += (ball.x - (bot.x + bot.width/2)) / (bot.width/2) * 3;
                    ball.y = bot.y + bot.height + ball.radius;
                }

                // Le joueur rate la balle
                if(ball.y > canvas.height) {
                    // Vérifier si record battu et envoyer à Firebase
                    if (player.score > bestUserScore) {
                        db.ref('scores/' + currentUser).set({
                            name: currentUser,
                            score: player.score
                        });
                        bestUserScore = player.score;
                    }
                    resetBall();
                } 
                // Bot rate (impossible théoriquement, mais au cas où)
                else if(ball.y < 0) {
                    ball.vy = -ball.vy; 
                }
            }
        }

        function drawPaddle(p, isP) {
            const cX = p.x + p.width/2, cY = p.y + p.height/2;
            ctx.fillStyle="rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(cX+8,cY+8,p.width/2,p.height/2,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle="#a66e3d"; ctx.fillRect(cX-8, isP?cY:cY-35, 16, 35);
            ctx.fillStyle=p.color; ctx.beginPath(); ctx.ellipse(cX,cY,p.width/2,p.height/2,0,0,Math.PI*2); ctx.fill();
        }

        function drawGame() {
            ctx.fillStyle="#2c2c2c"; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle="#1a6b3c"; ctx.fillRect(15,15,canvas.width-30,canvas.height-30);
            ctx.strokeStyle="white"; ctx.lineWidth=4; ctx.strokeRect(17,17,canvas.width-34,canvas.height-34);
            ctx.beginPath(); ctx.moveTo(canvas.width/2,15); ctx.lineTo(canvas.width/2,canvas.height-15); ctx.lineWidth=2; ctx.stroke();

            // Score du joueur au centre
            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            ctx.font = "bold 120px 'Share Tech Mono'"; ctx.textAlign = "center";
            ctx.fillText(player.score, canvas.width/2, canvas.height/2 + 40);

            const nY=canvas.height/2;
            ctx.fillStyle="rgba(0,0,0,0.3)"; ctx.fillRect(10,nY+2,canvas.width-20,8);
            ctx.fillStyle="#333"; ctx.fillRect(10,nY-4,canvas.width-20,8);
            ctx.fillStyle="white"; ctx.fillRect(10,nY-4,canvas.width-20,3);

            drawPaddle(player, true); drawPaddle(bot, false);

            if(gameState==='PLAYING' || gameState==='START') {
                ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.arc(ball.x+6,ball.y+6,ball.radius,0,Math.PI*2); ctx.fill();
                ctx.fillStyle=ball.color; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2); ctx.fill();
            }
            if(gameState==='START') {
                ctx.fillStyle="rgba(0,0,0,0.7)"; ctx.fillRect(0,canvas.height/2-25,canvas.width,50);
                ctx.fillStyle="white"; ctx.font="bold 18px 'Montserrat'"; ctx.fillText("APPUYEZ SUR ESPACE",canvas.width/2,canvas.height/2+6);
            }
        }

        function loop() { updateGame(); drawGame(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
